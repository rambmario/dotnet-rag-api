<text x="570" y="101" text-anchor="middle" font-size="11" fill="#085041">FastAPI · port 8000</text>
<line x1="485" y1="112" x2="655" y2="112" stroke="#9FE1CB" stroke-width="0.8"/>
<g font-size="11" fill="#2C2C2A">
