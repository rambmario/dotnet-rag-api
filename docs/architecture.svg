<text x="300" y="101" text-anchor="middle" font-size="11" fill="#3C3489">Clean Architecture · port 5000</text>
<line x1="210" y1="112" x2="390" y2="112" stroke="#AFA9EC" stroke-width="0.8"/>
<g font-size="11" fill="#2C2C2A">
<text x="210" y="132">• API key auth (X-Api-Key)</text>
